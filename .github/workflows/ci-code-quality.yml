name: Code Quality

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions: {}

jobs:
  ruff:
    name: Ruff (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install ruff
        run: python -m pip install --quiet --disable-pip-version-check "ruff==0.15.0"

      - name: Lint (configuration in ruff.toml)
        run: ruff check --output-format github .

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Lint shell scripts
        run: |
          shellcheck --version
          find . -name '*.sh' -not -path './.git/*' -not -path '*/node_modules/*' -print0 \
            | xargs -0 --no-run-if-empty shellcheck --severity=error
